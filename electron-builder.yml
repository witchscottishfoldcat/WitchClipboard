appId: com.witchcat.clipboard
# appId 保留旧值，保证已安装用户能原位升级。
productName: Witch Clipboard
copyright: Witch Clipboard

directories:
  output: release
  buildResources: build

# 自动更新的来源。有这段 electron-builder 才会生成 app-update.yml
# （打进 resources/），electron-updater 靠它知道去哪查版本。
publish:
  provider: github
  owner: witchscottishfoldcat
  repo: Witch-Clipboard

files:
  - out/**/*
  - package.json
  # 托盘图标和窗口图标运行时要读，必须打进 asar
  # tray@2x.png 不是多余的：nativeImage 会按 @2x 约定自动挑高分屏那一张
  - resources/icon.png
  - resources/icon.ico
  - resources/tray.png
  - resources/tray@2x.png
  # 原生模块的编译中间产物和测试扩展没必要跟着安装包走
  - '!node_modules/better-sqlite3-multiple-ciphers/build/Release/obj*/**'
  - '!node_modules/better-sqlite3-multiple-ciphers/build/Release/test_extension.node'
  - '!node_modules/better-sqlite3-multiple-ciphers/build/Release/*.{iobj,ipdb,lib,exp,pdb}'
  - '!node_modules/better-sqlite3-multiple-ciphers/{deps,src,build/deps}/**'
  - '!node_modules/better-sqlite3-multiple-ciphers/build/*.{vcxproj,vcxproj.filters,sln,mk,gypi}'

# 原生模块不能放在 asar 里
asarUnpack:
  - '**/*.node'

win:
  icon: resources/icon.ico
  target:
    - target: nsis
      arch: [x64, arm64]

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Witch Clipboard
  artifactName: Witch-Clipboard-${version}-${arch}-setup.${ext}
  # 卸载时保留用户数据目录，剪贴板历史不该被安装程序删掉
  deleteAppDataOnUninstall: false

mac:
  icon: resources/icon.png
  category: public.app-category.productivity
  target:
    - target: dmg
      arch: [x64, arm64]
    - target: zip
      arch: [x64, arm64]
  artifactName: Witch-Clipboard-${version}-${arch}.${ext}
