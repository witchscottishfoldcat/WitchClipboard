name: Release Tauri installers

on:
  workflow_dispatch:
  push:
    tags:
      - "app-v*"

permissions:
  contents: write

jobs:
  windows:
    strategy:
      fail-fast: false
      # tauri-action updates latest.json with a read/merge/delete/upload sequence. Serializing
      # architectures prevents two matrix jobs from losing each other's platform entry.
      max-parallel: 1
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            runner: windows-latest
          - target: aarch64-pc-windows-msvc
            runner: windows-11-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: app-v__VERSION__
          releaseName: Witch Clipboard __VERSION__
          releaseDraft: true
          generateReleaseNotes: true
          updaterJsonPreferNsis: true
          # Public release is intentionally unsigned for now.
          args: --bundles nsis --target ${{ matrix.target }} --config src-tauri/tauri.release.conf.json
      - name: Build portable package
        shell: pwsh
        run: |
          npx tauri build --ci --no-sign --no-bundle --target ${{ matrix.target }}
          $architecture = if ('${{ matrix.target }}' -eq 'aarch64-pc-windows-msvc') { 'arm64' } else { 'x64' }
          powershell -NoProfile -ExecutionPolicy Bypass -File scripts/package-portable.ps1 -Architecture $architecture
      - name: Upload portable package
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $version = (Get-Content -Raw -Encoding UTF8 package.json | ConvertFrom-Json).version
          $architecture = if ('${{ matrix.target }}' -eq 'aarch64-pc-windows-msvc') { 'arm64' } else { 'x64' }
          $asset = "release/Witch-Clipboard-$version-$architecture-portable.zip"
          gh release upload "app-v$version" $asset --clobber

  checksums:
    needs: windows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Matches the manually produced SHA256SUMS.txt shipped since 1.7.2: covers the six build
      # artifacts in a fixed order, excludes latest.json. Fails loudly if asset names change so
      # a release never ships with incomplete checksums.
      - name: Generate and upload SHA256SUMS.txt
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version=$(node -p "require('./package.json').version")
          tag="app-v$version"
          mkdir -p release/checksums && cd release/checksums
          gh release download "$tag" --repo "$GITHUB_REPOSITORY" --clobber \
            --pattern "Witch-Clipboard-$version-*-portable.zip" \
            --pattern "Witch.Clipboard_$version_*-setup.exe" \
            --pattern "Witch.Clipboard_$version_*-setup.exe.sig"
          sha256sum \
            "Witch-Clipboard-$version-arm64-portable.zip" \
            "Witch-Clipboard-$version-x64-portable.zip" \
            "Witch.Clipboard_${version}_arm64-setup.exe" \
            "Witch.Clipboard_${version}_arm64-setup.exe.sig" \
            "Witch.Clipboard_${version}_x64-setup.exe" \
            "Witch.Clipboard_${version}_x64-setup.exe.sig" \
            > SHA256SUMS.txt
          sha256sum -c SHA256SUMS.txt
          gh release upload "$tag" --repo "$GITHUB_REPOSITORY" SHA256SUMS.txt --clobber
